name: CI Deployment

on:
  push:
    branches:
      - 'main'
      - 'dev'

# One deployment per target at a time, queued in push order. Without this,
# two merges within one CI window run in parallel and the slower build wins
# the :prod / :staging tag, so the older commit can be rolled out last.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up release checks
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Verify production CMS contract
        if: github.ref == 'refs/heads/main'
        run: node scripts/release/library-public-check.cjs prod

      - name: Verify staging CMS contract
        if: github.ref == 'refs/heads/dev'
        run: node scripts/release/library-public-check.cjs staging

      - name: Preserve release check journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-release-checks
          path: docs/release-audits/journal.jsonl
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Warm only the dependency stage (base image + yarn install) into the
      # GitHub Actions cache. This runs before the env files exist and the
      # target stops at `deps`, so the exported layers never contain .env,
      # .env.staging, the built bundle or any secret. The full image build
      # below reads this cache and exports nothing. build-push-action is
      # required here: a plain `docker buildx build` in a run step has no
      # Actions cache credentials, so the first attempt (run 34249453906)
      # silently exported nothing.
      - name: Warm dependency layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          push: false
          cache-from: type=gha,scope=deps
          cache-to: type=gha,scope=deps,mode=max

      - name: 'Login to GitHub Container Registry'
        run: echo ${{secrets.REGISTRY_PASSWORD}} | docker login ${{secrets.REGISTRY_HOST}} --username ${{secrets.REGISTRY_USERNAME}} --password-stdin

      - name: Copy production env file
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.ENV_PRODUCTION }} | base64 -d > .env
          cp .env .env.staging

      - name: Copy staging env file
        if: github.ref == 'refs/heads/dev'
        run: |
          echo ${{ secrets.ENV_STAGING }} | base64 -d > .env.staging
          cp .env.staging .env

      - name: Production Deploy
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/keepsimple-next:prod
          cache-from: type=gha,scope=deps

      - name: Staging Deploy
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/keepsimple-next:staging
          cache-from: type=gha,scope=deps
