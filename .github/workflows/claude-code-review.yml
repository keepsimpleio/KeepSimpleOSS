name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Only review the latest push: rapid pushes to the same PR would otherwise
# spawn overlapping runs that race on the tracking comment and burn
# Max-subscription quota.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip draft PRs, and skip fork PRs: forked pull_request runs get no
    # repo secrets and a read-only GITHUB_TOKEN, so the job would fail
    # loudly on auth instead of skipping cleanly.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      findings: ${{ steps.signal.outputs.findings }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # A new review invalidates whatever the last one said. Clearing first means
      # a run that is cancelled (this workflow uses cancel-in-progress) or that
      # fails leaves the PR with no signal at all, rather than a stale "ready"
      # pointing at findings for an older commit.
      - name: Clear the previous handoff signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent:review-ready" 2>/dev/null || true

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against Mary's Claude Max subscription (OAuth token,
          # not an API key). Secret set at repo level: CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Use the workflow's own token so we don't need to install the
          # third-party Claude GitHub App on the org. Requires the job
          # permissions block below (pull-requests: write).
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Live progress checklist comment on the PR while reviewing.
          track_progress: true

          # Repo is public; the diff is not secret. Without this, a stalled
          # run (permission denials, API errors) is undiagnosable from the
          # job log.
          show_full_output: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing the KeepSimpleOSS codebase: a Next.js **Pages
            Router** app (React 19, TypeScript with strict off), styled with
            SCSS Modules. See AGENTS.md for the full conventions.

            Review this PR and focus on:

            1. Correctness & React best practices
               - Hooks rules, effect dependencies, stale closures
               - Unnecessary re-renders, missing keys, prop drilling
               - SSR/hydration safety: no `window`/`localStorage`/`document`
                 at module top level (guard in effects or use ssr:false)
            2. TypeScript quality
               - Avoid `any`, prefer precise types, exhaustive unions
            3. Project conventions (AGENTS.md) — flag violations:
               - App Router patterns (`'use client'`, `next/navigation`,
                 `src/app/`)
               - Tailwind, styled-components, CSS-in-JS, or inline styles
               - New state libraries (Redux, Zustand, Jotai, SWR, React Query)
               - Global CSS imported anywhere except `_app.tsx`
               - `<img src={svg}>` instead of importing SVGs as components
               - Named exports from `index.ts` barrels, or empty barrels
               - Import-order / path-alias violations
               - Changes to UX Core bias data, slugs, or schema (these need
                 explicit approval — flag, don't wave through)
            4. Accessibility & UX
               - Semantic HTML, aria attributes, keyboard nav
            5. Security
               - XSS via dangerouslySetInnerHTML, unsanitized input,
                 leaked secrets/env, unsafe URL handling
            6. Styling
               - SCSS module hygiene; no hardcoded colors/spacing/breakpoints
                 that bypass the design tokens (keepsimple-style)

            Leave inline comments for specific issues via the inline-comment
            tool. Put your overall assessment and any praise in the tracking
            comment summary. Be concise and actionable; skip nitpicks that a
            linter would catch.

            Review in a single pass. Do not split the work into sub-reviews
            or wait on anything: read the diff, post inline comments as you
            find issues, then write the summary. If a tool call is denied,
            continue without it and note the gap in the summary rather than
            stopping. Always finish by updating the tracking comment with
            the final summary.

          # Only the PR/commit-scoped inline-comment tool is granted. We
          # deliberately do NOT grant raw `gh pr comment/view/diff`: those are
          # unscoped, and since the review reads untrusted PR content (diff,
          # description) a prompt-injection payload could steer them at other
          # PRs/issues. PR context + diff are already injected via track_progress.
          #
          # Read-only git is allowed so large PRs can be diffed locally, and
          # Agent so the model can fan out on 100+ file PRs instead of
          # hitting permission denials and giving up (see PR #185 run).
          # --max-turns caps a big review so it finishes the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --max-turns 120

      # The handoff. A fixer agent watches for this label rather than trying to
      # parse the review prose.
      #
      # Only label when the review left inline comments against the CURRENT head
      # commit. Two reasons: a clean review should not wake anyone, and — more
      # importantly — the fixer's own push starts a fresh review, so labelling
      # unconditionally would hand it back its own work forever. A review that
      # finds nothing ends the cycle by staying silent.
      - name: Signal that findings are ready to fix
        id: signal
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          findings=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\")] | length")
          echo "inline findings on $HEAD_SHA: $findings"
          echo "findings=${findings:-0}" >> "$GITHUB_OUTPUT"
          if [ "${findings:-0}" -gt 0 ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "agent:review-ready"
            echo "labelled agent:review-ready"
          else
            echo "clean review — no handoff"
          fi

  # Fix what the review just found, in the same run. No one's laptop, no timer,
  # no one told to go and do something.
  #
  # This cannot loop. The push below uses GITHUB_TOKEN, and GitHub deliberately
  # does not start workflows from GITHUB_TOKEN pushes — so the fix commit does
  # NOT trigger another review, and therefore cannot trigger another fix. One
  # review, one fix pass, then it stops and waits for a person. The round guard
  # below is a second belt for the case where someone later swaps in a PAT.
  claude-fix:
    needs: claude-review
    if: fromJSON(needs.claude-review.outputs.findings || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v6
        with:
          # The branch itself, not the merge ref: this job commits to it.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refuse to go round again
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The PR's own commits, via the API. `git log base..HEAD` would be the
          # obvious way and does not work here: actions/checkout only fetches the
          # ref it was given, so origin/<base> is not present to diff against.
          rounds=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '[.[] | select(.commit.message | contains("[agent-fix]"))] | length')
          echo "previous agent-fix commits on this PR: $rounds"
          if [ "${rounds:-0}" -ge 2 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand back to a human
        if: steps.guard.outputs.proceed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent:needs-human" 2>/dev/null || true

      - name: Claude Fix
        if: steps.guard.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The automated review on this PR left inline comments. Address them,
            on this branch, and push.

            Rules:
            - Fix only what the inline comments raise. Do not refactor, tidy
              adjacent code, or "improve" anything nobody asked about — an
              unattended agent widening its own scope is how a small PR becomes
              an unreviewable one.
            - Judge each comment before acting. Automated review is wrong
              sometimes. If a comment is mistaken or its fix would be worse than
              the problem, leave the code alone and say so in your summary.
            - Match the conventions in AGENTS.md.
            - Commit with `[agent-fix]` in the subject line, then push with the
              action's git-push script. One commit per distinct fix where that is
              natural.
            - If you cannot fix something safely, leave it and name it in the
              summary. Half a fix pushed unattended is worse than none.

            Finish by summarising, per comment: fixed, or skipped and why.

          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/v1/scripts/git-push.sh:*)"
            --max-turns 80
